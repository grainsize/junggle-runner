<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jungle Runner" />
  <title>Jungle Runner</title>

  <link rel="manifest" href="/jungle-runner/manifest.json">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/jungle-runner/service-worker.js");
      });
    }
  </script>
  
  <style>
    :root{
      --bg:#0b1b12;
      --hudText:#d7ffe7;
      --panel: rgba(255,255,255,.06);
      --panelBorder: rgba(255,255,255,.10);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
    }

    body {
      font-family: system-ui, Arial, sans-serif;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 8px;
      box-sizing: border-box;
      overscroll-behavior: none;
    }

    .wrap{
      width: 100%;
      max-width: 980px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 104px;
      box-sizing: border-box;
    }

    canvas{
      width: 100%;
      height: auto;
      max-height: calc(100vh - 160px);
      background: radial-gradient(circle at 30% 30%, #143b24 0%, #07140d 55%, #040b07 100%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      display: block;
      margin: 0 auto;
    }

    .hud{
      color: var(--hudText);
      opacity: .92;
      font-size: 13px;
      line-height: 1.35;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      margin: 0 2px;
    }

    .chip{
      background: var(--panel);
      border: 1px solid var(--panelBorder);
      border-radius: 999px;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .hint{
      opacity:.85;
      white-space: normal;
    }

    kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    .controls {
      position: fixed;
      left: 0; right: 0;
      bottom: env(safe-area-inset-bottom, 0px);
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      gap: 14px;
      z-index: 10;
    }

    .pad, .jump {
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      border-radius: 18px;
    }

    .pad { width: 190px; height: 86px; display:flex; gap:10px; padding: 10px; }
    .btn {
      flex:1;
      display:flex;
      align-items:center; justify-content:center;
      font-size: 22px;
      border-radius: 14px;
      background: rgba(0,0,0,0.18);
    }
    .jump { width: 92px; height: 92px; display:flex; align-items:center; justify-content:center; font-size: 22px; }

    @media (hover: none) and (pointer: coarse) {
      .controls { display: flex; }
      .hud { font-size: 12px; }
      .chip { padding: 6px 9px; }
      .wrap { padding-bottom: 118px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="chip"><b>Rounds:</b> R1 &gt; 200 · R2 &gt; 500 · R3 &gt; 1000 (Final Win 👑)</div>
      <div class="chip"><b>Stomp points:</b> 🐇+10 · 🦁+20 · 🐻+30 · 🦖+40 · 🐅+50 (hunt)</div>
      <div class="chip"><b>Lose:</b> side hit by 🦁 🐅 🐻 🦖</div>
      <div class="chip hint">
        <b>Controls:</b> <kbd>←</kbd>/<kbd>→</kbd> move · <kbd>Space</kbd> jump (double jump) · Mobile: buttons
      </div>
      <div class="chip"><span id="statusText">Press Space (or Jump) to start</span></div>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="pad">
      <div class="btn" id="btnLeft">◀</div>
      <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="jump" id="btnJump">⤒</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: true });
  const statusText = document.getElementById("statusText");

  const LOGICAL_W = 960;
  const LOGICAL_H = 540;

  function resizeCanvas() {
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const reserveBottom = 170;

    const availW = Math.max(320, window.innerWidth - 16);
    const availH = Math.max(420, window.innerHeight - reserveBottom);

    const ratio = LOGICAL_W / LOGICAL_H;

    let cssW = availW;
    let cssH = cssW / ratio;
    if (cssH > availH) {
      cssH = availH;
      cssW = cssH * ratio;
    }

    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";

    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);

    ctx.setTransform(canvas.width / LOGICAL_W, 0, 0, canvas.height / LOGICAL_H, 0, 0);
  }

  window.addEventListener("resize", resizeCanvas, { passive: true });
  window.addEventListener("orientationchange", resizeCanvas, { passive: true });
  resizeCanvas();

  const W = LOGICAL_W, H = LOGICAL_H;
  const groundY = Math.floor(H * 0.78);

  const gravity = 2200;
  const jumpV = 820;
  const doubleJumpV = 760;

  const BOUNCE = { lion: 980, tiger: 860, rabbit: 760, bear: 920, dino: 940 };
  const SCORE  = { rabbit: 10, lion: 20, bear: 30, dino: 40, tiger: 50 };
  const ROUND_TARGET = { 1: 200, 2: 500, 3: 1000 };

  const player = {
    x: Math.floor(W * 0.18),
    y: groundY,
    w: 46,
    h: 64,
    vy: 0,
    onGround: true,
    jumpsLeft: 2,
    crown: false
  };

  const playerMoveSpeed = 420;

  let running = false, gameOver = false, win = false;
  let lastTs = 0;
  let baseSpeed = 360;
  let speed = baseSpeed;
  let distance = 0;

  let score = 0;
  let round = 1;
  let bannerT = 0;

  const entities = [];
  let idSeq = 1;
  let nextSpawnIn = 0.8;

  const keys = { left:false, right:false, space:false };

  window.addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft")  { keys.left = true; e.preventDefault(); }
    if (e.code === "ArrowRight") { keys.right = true; e.preventDefault(); }
    if (e.code === "Space") {
      e.preventDefault();
      if (!keys.space) onJumpPressed();
      keys.space = true;
    }
    if (e.code === "Enter") {
      if (gameOver || win) reset();
    }
  }, { passive: false });

  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft") keys.left = false;
    if (e.code === "ArrowRight") keys.right = false;
    if (e.code === "Space") keys.space = false;
  });

  function bindHoldButton(el, onDown, onUp){
    const down = (e)=>{ e.preventDefault(); onDown(); };
    const up   = (e)=>{ e.preventDefault(); onUp(); };
    el.addEventListener("pointerdown", down, { passive:false });
    el.addEventListener("pointerup", up, { passive:false });
    el.addEventListener("pointercancel", up, { passive:false });
    el.addEventListener("pointerout", up, { passive:false });
  }

  const btnLeft  = document.getElementById("btnLeft");
  const btnRight = document.getElementById("btnRight");
  const btnJump  = document.getElementById("btnJump");

  bindHoldButton(btnLeft,  ()=> keys.left = true,  ()=> keys.left = false);
  bindHoldButton(btnRight, ()=> keys.right = true, ()=> keys.right = false);

  btnJump.addEventListener("pointerdown", (e)=>{
    e.preventDefault();
    onJumpPressed();
  }, { passive:false });

  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  function onJumpPressed() {
    if (!running) {
      running = true;
      statusText.textContent = "Running";
      return;
    }
    if (gameOver || win) return;

    if (player.onGround) {
      player.vy = -jumpV;
      player.onGround = false;
      player.jumpsLeft = 1;
    } else if (player.jumpsLeft > 0) {
      player.vy = -doubleJumpV;
      player.jumpsLeft -= 1;
    }
  }

  function reset() {
    running = false; gameOver = false; win = false;
    distance = 0;
    score = 0;
    round = 1;
    bannerT = 0;
    baseSpeed = 360;
    speed = baseSpeed;

    entities.length = 0;
    idSeq = 1;

    player.x = Math.floor(W * 0.18);
    player.y = groundY;
    player.vy = 0;
    player.onGround = true;
    player.jumpsLeft = 2;
    player.crown = false;

    scheduleNextSpawn();
    statusText.textContent = "Press Space (or Jump) to start";
  }

  function defeat(reason) {
    if (gameOver || win) return;
    gameOver = true;
    running = false;
    statusText.textContent = "Defeated: " + reason + " (Press Enter to restart)";
  }

  function victory() {
    if (win) return;
    win = true;
    running = false;
    player.crown = true;
    statusText.textContent = "Final Victory 👑 (Press Enter to play again)";
  }

  function spawn(type) {
    const e = {
      id: idSeq++,
      type,
      x: W + 60,
      y: groundY,
      w: 64,
      h: 56,
      stomped: false,
    };

    if (type === "rabbit") { e.w = 44; e.h = 40; e.y = groundY + 8; }
    if (type === "lion")   { e.w = 78; e.h = 56; e.y = groundY + 4; }
    if (type === "tiger")  { e.w = 78; e.h = 56; e.y = groundY + 4; }
    if (type === "bear")   { e.w = 84; e.h = 60; e.y = groundY + 2; }
    if (type === "dino")   { e.w = 92; e.h = 64; e.y = groundY + 0; }

    entities.push(e);
  }

  function chooseSpawn() {
    const r = Math.random();
    const pRabbit = (round === 1) ? 0.42 : (round === 2 ? 0.36 : 0.32);
    const pTiger  = (round === 1) ? 0.26 : (round === 2 ? 0.28 : 0.28);
    const pBear   = (round >= 2) ? 0.16 : 0.0;
    const pDino   = (round >= 3) ? 0.14 : 0.0;

    if (r < pRabbit) return "rabbit";
    if (r < pRabbit + pTiger) return "tiger";
    if (round >= 2 && r < pRabbit + pTiger + pBear) return "bear";
    if (round >= 3 && r < pRabbit + pTiger + pBear + pDino) return "dino";
    return "lion";
  }

  function scheduleNextSpawn() {
    const roundHard = (round === 1) ? 0 : (round === 2 ? 0.12 : 0.22);
    const minGap = Math.max(0.42, 1.00 - distance / 14000 - roundHard);
    const maxGap = Math.max(0.78, 1.65 - distance / 11000 - roundHard);
    nextSpawnIn = minGap + Math.random() * (maxGap - minGap);
  }

  function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function playerRect() {
    return { x: player.x + 8, y: player.y - player.h + 6, w: player.w - 16, h: player.h - 10 };
  }

  function entityRect(e) {
    return { x: e.x + 6, y: e.y - e.h + 6, w: e.w - 12, h: e.h - 10 };
  }

  function isFalling() { return player.vy > 180; }

  function stompFromAbove(e) {
    const pr = playerRect();
    const er = entityRect(e);
    const playerBottom = pr.y + pr.h;
    const entityTop = er.y;
    return isFalling() && playerBottom <= entityTop + 14;
  }

  function addScore(pts) {
    score += pts;

    if (round === 1 && score > ROUND_TARGET[1]) {
      round = 2; bannerT = 2.0; baseSpeed = 390;
    } else if (round === 2 && score > ROUND_TARGET[2]) {
      round = 3; bannerT = 2.0; baseSpeed = 420;
    } else if (round === 3 && score > ROUND_TARGET[3]) {
      victory();
    }
  }

  function update(dt) {
    if (!running || gameOver || win) return;

    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) {
      player.x += dir * playerMoveSpeed * dt;
      player.x = Math.max(10, Math.min(W - player.w - 10, player.x));
    }

    distance += speed * dt;
    const roundRamp = (round === 1) ? 0 : (round === 2 ? 25 : 45);
    speed = Math.min(640, baseSpeed + distance / 70 + roundRamp);

    nextSpawnIn -= dt;
    if (nextSpawnIn <= 0) {
      spawn(chooseSpawn());
      scheduleNextSpawn();
    }

    if (!player.onGround) player.vy += gravity * dt;
    player.y += player.vy * dt;

    if (player.y >= groundY) {
      player.y = groundY;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = 2;
    } else {
      player.onGround = false;
    }

    for (let i = entities.length - 1; i >= 0; i--) {
      const e = entities[i];
      e.x += (-speed) * dt;
      if (e.x < -220) entities.splice(i, 1);
    }

    if (bannerT > 0) bannerT = Math.max(0, bannerT - dt);

    const pr = playerRect();

    for (let i = 0; i < entities.length; i++) {
      const e = entities[i];
      const er = entityRect(e);

      if (!aabb(pr.x, pr.y, pr.w, pr.h, er.x, er.y, er.w, er.h)) continue;

      if (stompFromAbove(e)) {
        if (e.type === "tiger") {
          addScore(SCORE.tiger);
          player.vy = -BOUNCE.tiger;
          player.onGround = false;
          player.jumpsLeft = 1;
          entities.splice(i, 1);
          i--;
          continue;
        }

        if (e.type === "lion")  { addScore(SCORE.lion);  player.vy = -BOUNCE.lion;  player.onGround = false; player.jumpsLeft = 1; continue; }
        if (e.type === "rabbit"){ addScore(SCORE.rabbit);player.vy = -BOUNCE.rabbit;player.onGround = false; player.jumpsLeft = 1; continue; }
        if (e.type === "bear")  { addScore(SCORE.bear);  player.vy = -BOUNCE.bear;  player.onGround = false; player.jumpsLeft = 1; continue; }
        if (e.type === "dino")  { addScore(SCORE.dino);  player.vy = -BOUNCE.dino;  player.onGround = false; player.jumpsLeft = 1; continue; }
      }

      if (e.type === "rabbit") continue;
      if (e.type === "lion")  { defeat("lion caught you"); return; }
      if (e.type === "tiger") { defeat("tiger caught you"); return; }
      if (e.type === "bear")  { defeat("bear caught you"); return; }
      if (e.type === "dino")  { defeat("dino caught you"); return; }
    }
  }

  function drawBackground() {
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = "#0b2a18";
    for (let i = 0; i < 22; i++) {
      const x = (i * 90 - (distance * 0.18) % 90);
      const y = 40 + (i % 5) * 18;
      ctx.beginPath();
      ctx.ellipse(x, y, 90, 18, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, groundY + 18, W, H - (groundY + 18));
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = "rgba(140,255,180,0.18)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY + 12);
    ctx.lineTo(W, groundY + 12);
    ctx.stroke();
    ctx.restore();
  }

  function drawEntity(e) {
    let emoji = "❓";
    if (e.type === "rabbit") emoji = "🐇";
    if (e.type === "lion")   emoji = "🦁";
    if (e.type === "tiger")  emoji = "🐅";
    if (e.type === "bear")   emoji = "🐻";
    if (e.type === "dino")   emoji = "🦖";

    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(e.x + e.w * 0.5, groundY + 16, e.w * 0.38, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.font = `${Math.floor(e.h)}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(emoji, e.x + e.w * 0.5, e.y + 10);
    ctx.restore();
  }

  function drawPlayer() {
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(player.x + player.w * 0.5, groundY + 16, 22, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.font = `${Math.floor(player.h)}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("🧍", player.x + player.w * 0.5, player.y + 8);
    ctx.restore();

    if (player.crown) {
      ctx.save();
      ctx.font = `34px system-ui, Apple Color Emoji, Segoe UI Emoji`;
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText("👑", player.x + player.w * 0.5, player.y - player.h + 12);
      ctx.restore();
    }
  }

  function drawHUD() {
    ctx.save();

    // mini HUD
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(16, 16, 380, 132);
    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.strokeRect(16, 16, 380, 132);

    ctx.fillStyle = "rgba(215,255,231,0.95)";
    ctx.font = "18px system-ui, Arial";
    ctx.fillText(`Round: ${round}`, 28, 32);
    ctx.fillText(`Score: ${score}`, 28, 58);

    ctx.font = "14px system-ui, Arial";
    ctx.fillText(`Target: > ${ROUND_TARGET[round]}`, 28, 84);

    const extras =
      (round === 1) ? "R1: 🐇 🦁 🐅" :
      (round === 2) ? "R2: + 🐻 (faster)" :
                      "R3: + 🦖 (faster)";
    ctx.fillText(extras, 28, 106);

    // START overlay
    if (!running && !gameOver && !win) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "rgba(215,255,231,0.98)";
      ctx.textAlign = "center";

      ctx.font = "46px system-ui, Arial";
      ctx.fillText("Jungle Runner", W / 2, H * 0.22);

      ctx.font = "18px system-ui, Arial";
      ctx.fillText("동물을 점프해서 밟는 게임.", W / 2, H * 0.29);

      const boxW = 760, boxH = 300;
      const boxX = (W - boxW) / 2;
      const boxY = H * 0.33;

      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      ctx.fillStyle = "rgba(215,255,231,0.98)";
      ctx.textAlign = "left";
      ctx.font = "18px system-ui, Arial";

      const lx = boxX + 26;
      let ly = boxY + 38;
      const lh = 28;

      ctx.fillText("설명", lx, ly); ly += lh;
      ctx.font = "16px system-ui, Arial";
      ctx.fillText("• 토끼 🐇: 초식 동물이라 만나도 괜찮음.", lx, ly); ly += lh;
      ctx.fillText("• 사자 🦁, 호랑이 🐅, 곰 🐻, 공룡 🦖: 만나면 게임 오버.", lx, ly); ly += lh;

      ly += 10;
      ctx.font = "18px system-ui, Arial";
      ctx.fillText("밟았을 때 점수", lx, ly); ly += lh;
      ctx.font = "16px system-ui, Arial";
      ctx.fillText("• 토끼 🐇 +10   • 사자 🦁 +20", lx, ly); ly += lh;
      ctx.fillText("• 곰 🐻 +30   • 공룡 🦖 +40", lx, ly); ly += lh;
      ctx.fillText("• 호랑이 🐅 +50 (밟으면 제거)", lx, ly); ly += lh;

      ly += 10;
      ctx.font = "18px system-ui, Arial";
      ctx.fillText("조작법", lx, ly); ly += lh;
      ctx.font = "16px system-ui, Arial";
      ctx.fillText("• 점프: 스페이스바 / 화면 버튼", lx, ly); ly += lh;
      ctx.fillText("• 이동: 좌우 방향키 / 화면 버튼", lx, ly); ly += lh;

      ctx.textAlign = "center";
      ctx.font = "18px system-ui, Arial";
      ctx.fillText("Press Space (or Jump) to start", W / 2, H * 0.92);
      ctx.textAlign = "left";
    }

    // Round cleared overlay
    if (bannerT > 0) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(220,255,230,0.98)";
      ctx.textAlign = "center";
      ctx.font = "40px system-ui, Arial";
      ctx.fillText(`Round ${round - 1} Cleared`, W / 2, H * 0.40);
      ctx.font = "18px system-ui, Arial";
      ctx.fillText(`Round ${round} starts now`, W / 2, H * 0.48);
      ctx.textAlign = "left";
    }

    // Game over overlay
    if (gameOver) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(255,220,220,0.98)";
      ctx.textAlign = "center";
      ctx.font = "36px system-ui, Arial";
      ctx.fillText("Defeated", W / 2, H * 0.35);
      ctx.font = "18px system-ui, Arial";
      ctx.fillText("Press Enter to restart", W / 2, H * 0.43);
      ctx.textAlign = "left";
    }

    // Win overlay
    if (win) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(220,255,230,0.98)";
      ctx.textAlign = "center";
      ctx.font = "36px system-ui, Arial";
      ctx.fillText("Final Victory 👑", W / 2, H * 0.35);
      ctx.font = "18px system-ui, Arial";
      ctx.fillText("Score exceeded 1000. Press Enter to play again.", W / 2, H * 0.43);
      ctx.textAlign = "left";
    }

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    for (const e of entities) drawEntity(e);
    drawPlayer();
    drawHUD();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(0.033, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
